# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: waste2worth
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_FEE_BPS
        value: "500"
      - key: PAYPAL_ENV
        value: sandbox
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: SUPPLIER_PAYOUT_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DATABASE_URL
        sync: false
